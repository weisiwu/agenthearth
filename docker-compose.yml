name: agenthearth

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: agenthearth-web:${AGENTHEARTH_VERSION:-0.3.0}
    container_name: agenthearth-web
    environment:
      NODE_ENV: production
      PORT: 14211
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${AGENTHEARTH_WEB_PORT:-14211}:14211"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:14211/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
